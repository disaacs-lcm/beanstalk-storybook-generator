services:
  - type: web
    name: beanstalk-storybook
    runtime: python
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run gunicorn app:app --timeout 180 --threads 8
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: storybook-db
          property: connectionString
databases:
  - name: storybook-db
    plan: free
